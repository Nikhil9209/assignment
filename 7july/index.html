<!DOCTYPE html>
<html>
<head>
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #timer {
      font-size: 48px;
      margin: 20px 0;
    }

    .controls button {
      padding: 10px 15px;
      margin: 5px;
      font-size: 16px;
    }

    .settings input {
      width: 50px;
      text-align: center;
    }

    .session-type {
      font-weight: bold;
      margin-bottom: 10px;
    }

    #cycle-indicator {
      font-size: 24px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Pomodoro Timer</h1>

  <div class="settings">
    <p>
      Work (min): <input type="number" id="workInput" value="25">
      Short Break: <input type="number" id="shortBreakInput" value="5">
      Long Break: <input type="number" id="longBreakInput" value="15">
      Rounds before Long Break: <input type="number" id="roundsInput" value="4">
    </p>
  </div>

  <div class="session-type" id="sessionType">Session: Work</div>

  <div id="timer">25:00</div>

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="cycle-indicator">🔴 ⚪ ⚪ ⚪</div>

  <script src="script.js"></script>
</body>
</html>
